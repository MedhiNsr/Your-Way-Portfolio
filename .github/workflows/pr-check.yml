name: PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - data/france-osm-tunnel-snapshot

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
